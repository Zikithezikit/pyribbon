name: Statistics

# The statistical tests (millions of probes) are too slow for every push: run them weekly and on demand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - name: Measured false-positive rates and construction success
        run: PYRIBBON_STATS_OUT=stats.json pytest -m slow -s
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stats
          path: stats.json
          if-no-files-found: ignore
      - name: C core false-positive report
        run: make -C core fpr-report

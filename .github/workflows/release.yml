name: Release

# Pushing a version tag (v0.1.0, v0.2.0rc1, ...) tests everything, builds the sdist and the wheels, publishes them to PyPI
# and creates a GitHub release.
#
# Publishing happens in the `publish` job only, and that job runs only for a *push* of a tag named v*. A manual run
# (Actions > Release > Run workflow), even one started from a tag, is a dry run: it builds and checks everything and
# publishes nothing. tests/test_release_workflow.py fails if this guard is weakened.
#
# Needs the repository secret PYPI_API_TOKEN. For the very first upload of a new project PyPI only accepts an account-wide
# token; after that, replace it with a token scoped to this project.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  wheels:
    uses: ./.github/workflows/wheels.yml

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Everything that can be checked without publishing. Runs for tags and for manual dry runs.
  check:
    name: Check the release files
    needs: [ci, wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag check below needs the history of main
      - name: Check that the tag equals the package version and that its commit is on main
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml (v${version})"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "commit ${GITHUB_SHA} is not on main: refusing to release it"; exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check what was built
        run: |
          ls -l dist
          [ "$(ls dist/*.tar.gz | wc -l)" = "1" ] || { echo "expected exactly one sdist"; exit 1; }
          for platform in manylinux musllinux macosx win; do
            ls dist/*"${platform}"*.whl > /dev/null || { echo "no ${platform} wheel was built"; exit 1; }
          done
          pipx run twine check --strict dist/*

  # The only job that can publish. It runs only when a tag named v* is pushed.
  publish:
    name: Publish to PyPI and create the GitHub release
    needs: [check]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # sign the build provenance
      contents: write # create the GitHub release
      attestations: write # store the attestation
    steps:
      - name: Refuse to run for anything but a pushed version tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "publishing is only allowed for a pushed v* tag (event=${GITHUB_EVENT_NAME}, ref=${GITHUB_REF})"; exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Install uv
        # setup-uv publishes exact tags only (no floating v10 major tag), so pin the full version
        uses: astral-sh/setup-uv@v10.3.3
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          [ -n "${UV_PUBLISH_TOKEN}" ] || { echo "the repository secret PYPI_API_TOKEN is not set"; exit 1; }
          # --check-url skips files that are already on PyPI, so a failed run can be repeated safely
          uv publish --check-url https://pypi.org/simple/ dist/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if ! echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" ${flags}

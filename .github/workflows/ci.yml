name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  c-core:
    name: C core (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      # -std=c11 -Wall -Wextra -Wconversion -Wshadow -Wcast-align -Werror (see core/Makefile)
      - name: Unit tests, warnings as errors
        run: make -C core test
      - name: Unit tests with the portable bit-op fallbacks forced
        run: make -C core portable
      - name: Unit tests under ASan + UBSan
        run: make -C core asan

  fuzz:
    name: Loader fuzzing (libFuzzer, time-boxed)
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - name: Install the libFuzzer runtime (the job falls back to the built-in mutation driver if this fails)
        run: |
          v=$(clang --version | sed -n 's/.*version \([0-9]*\)\..*/\1/p' | head -1)
          sudo apt-get update -qq && sudo apt-get install -y -qq "libclang-rt-${v}-dev" || echo "libFuzzer runtime not installed"
      # libFuzzer when the runtime is present (60 s), otherwise the built-in mutation driver (same harness).
      - run: make -C core fuzz FUZZ_ITERS=20000000

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Virtualenv and editable install (the same two commands as in CONTRIBUTING.md)
        run: make venv install-dev
      - name: Lint
        run: make lint
      - name: Docstrings (Google style)
        run: make docstyle
      - name: Type check (mypy strict) and stubtest against the compiled module
        run: make typecheck
      - name: Tests (the statistical tests run in stats.yml)
        run: make pytest ARGS="-m 'not slow'"

  other-os:
    name: ${{ matrix.os }} (compiler and bit-op coverage)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -m "not slow"

  bench-smoke:
    name: Benchmark harness (--quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e '.[bench]'
      - name: Quick benchmark run (numbers are not meaningful; this keeps the harness working)
        run: python benchmarks/bench.py --quick --out-dir "$RUNNER_TEMP/bench"

  sdist:
    name: sdist builds with a plain C compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --sdist
      - run: twine check dist/*
      - name: "Build a wheel from the unpacked sdist (no git, no cmake, no meson; only setuptools and cc)"
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/pyribbon-* && python -m pip wheel --no-deps -w /tmp/wheel . && ls /tmp/wheel
      - name: The C core builds from the sdist without Python
        run: make -C /tmp/sdist/pyribbon-*/core test

  sanitize-python:
    name: Extension under ASan + UBSan
    runs-on: ubuntu-latest
    env:
      PYRIBBON_SANITIZED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest hypothesis xxhash "setuptools>=77" wheel
      - name: Build the extension with sanitizers
        run: |
          CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -O1 -g -fno-omit-frame-pointer" \
          LDFLAGS="-fsanitize=address,undefined" pip install --no-build-isolation .
      - name: Run the tests (the interpreter is not sanitized, so preload the runtime)
        run: |
          LD_PRELOAD=$(gcc -print-file-name=libasan.so) ASAN_OPTIONS=detect_leaks=0 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 python -m pytest -m "not slow" -q -p no:cacheprovider
